# ipfs_back 2.2.2
# Сборка: docker compose up --build
# Файлы с хоста:
#   ./Upload      — кладёте новые файлы
#   ./Synced_dir  — получаете копии
#   ./data        — mapping, deleted_files, логи
#   ./ipfs-repo   — репозиторий Kubo (PeerID сохраняется между перезапусками)

services:
  ipfs-back:
    build:
      context: .
      args:
        KUBO_VERSION: v0.38.2
    container_name: ipfs-back
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "8080:8080"
    volumes:
      - ./Upload:/app/Upload:Z
      - ./Synced_dir:/app/Synced_dir:Z
      - ./data:/app/data:Z
      - ./ipfs-repo:/data/ipfs:Z
    environment:
      IPFS_PATH: /data/ipfs
      IPFS_BIN: /usr/local/bin/ipfs
    # Для публичной сети контейнеру нужен исходящий интернет.
    # host-сеть на Linux даёт лучший NAT/mDNS; на Docker Desktop (Windows/macOS)
    # оставляйте bridge + проброс 4001.
