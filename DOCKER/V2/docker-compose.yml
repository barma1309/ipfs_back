# ipfs_back 2.3.1
# Build: docker compose up --build
# Host directories:
#   ./Upload      - incoming files
#   ./Synced_dir  - synchronized copies
#   ./data        - SQLite database and logs
#   ./ipfs-repo   - Kubo repository (preserves PeerID across restarts)

services:
  ipfs-back:
    build:
      context: .
      args:
        KUBO_VERSION: v0.38.2
    container_name: ipfs-back
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "8080:8080"
    volumes:
      - ./Upload:/app/Upload:Z
      - ./Synced_dir:/app/Synced_dir:Z
      - ./data:/app/data:Z
      - ./ipfs-repo:/data/ipfs:Z
    environment:
      IPFS_PATH: /data/ipfs
      IPFS_BIN: /usr/local/bin/ipfs
    # The public network requires outbound internet access from the container.
    # Host networking improves NAT/mDNS on Linux. On Docker Desktop (Windows/macOS),
    # use bridge networking with port 4001 forwarded.
